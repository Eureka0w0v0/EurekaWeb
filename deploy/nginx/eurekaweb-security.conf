# Security headers for every response from the main site.
#
# Included at server level by eurekaweb.conf and again inside every location
# below it: nginx does not merge add_header down into a location that
# declares any add_header of its own, so a location that sets Cache-Control
# would otherwise silently drop all four of these.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
