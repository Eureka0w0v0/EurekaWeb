# EurekaWeb: compression, caching and error page for the main site.
#
# This file is the source of truth for the site's response headers. It is
# installed to /etc/nginx/snippets/ and included from both server blocks of
# /etc/nginx/sites-available/default; see deploy/README.md.

# nginx.conf already has `gzip on`, but leaves gzip_types at its default of
# text/html -- so the stylesheets and scripts would go out uncompressed.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/manifest+json image/svg+xml;

error_page 404 /404.html;

include snippets/eurekaweb-security.conf;

# Everything with a ?v= content hash can be pinned for a year: when the bytes
# change, tools/stamp-assets.py changes the URL. This is what makes the stamps
# worth maintaining -- without it every asset took an ETag round trip on
# every load.
location ~* \.(?:css|js|webp|png|jpe?g|gif|svg|ico|woff2?)$ {
    include snippets/eurekaweb-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The three exceptions, matched exactly so they win over the regex above.
#
# sw.js must never be pinned: a worker cached for a year can never be
# replaced, and the site would be stuck on whichever one a visitor installed
# first.
location = /sw.js {
    include snippets/eurekaweb-security.conf;
    add_header Cache-Control "no-cache" always;
}

# site-config.json drives maintenance mode; a stale copy would strand the site
# in or out of it.
location = /site-config.json {
    include snippets/eurekaweb-security.conf;
    add_header Cache-Control "no-store" always;
}

# default_type here, NOT a server-level `types { }` block: that directive
# REPLACES the inherited mime.types map rather than extending it, which turns
# every other file on the site into application/octet-stream. Paired with the
# nosniff header above, that stops the browser applying the stylesheet or
# running the script at all.
location = /manifest.webmanifest {
    include snippets/eurekaweb-security.conf;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
}

# Documents carry no stamp -- their URLs never change -- so they revalidate.
location ~* \.html$ {
    include snippets/eurekaweb-security.conf;
    add_header Cache-Control "no-cache" always;
}
