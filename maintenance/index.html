<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eureka Web | Maintenance</title>
    <meta
      name="description"
      content="Eureka Web 正在维护中，请稍后再访问。"
    />
    <link rel="stylesheet" href="./maintenance.css" />
  </head>
  <body>
    <div class="noise"></div>

    <main class="maintenance-shell">
      <section class="maintenance-card">
        <p class="eyebrow">EUREKA WEB</p>
        <h1>网站维护中</h1>
        <p class="maintenance-text">
          当前页面正在进行内容调整与细节优化，暂时关闭对外访问。
          稍后重新打开时，你会看到更新后的版本。
        </p>

        <div class="status-row">
          <span class="status-dot"></span>
          <span>Temporary Maintenance Mode</span>
        </div>

        <div class="maintenance-panel">
          <p>维护说明</p>
          <p>页面结构、视觉细节与交互效果正在更新中。</p>
        </div>
      </section>
    </main>

    <script src="./maintenance.js"></script>
  </body>
</html>
