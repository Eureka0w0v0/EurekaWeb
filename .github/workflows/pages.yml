name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs in check mode rather than rewriting: tools/deploy.py publishes
      # the main site from the committed files, so the stamped index.html has
      # to be the committed one or the two hosts would serve different URLs.
      # Failing here is the point -- an unstamped asset is invisible to anyone
      # who has already visited, because deploy/nginx marks it immutable for a
      # year.
      - name: Check asset cache stamps are current
        run: python3 tools/stamp-assets.py --check

      - name: Check the photo cards match data/photos.json
        run: python3 tools/build-photos.py --check

      - name: Check site consistency
        run: python3 tools/check-site.py

      # The runner image ships Google Chrome. Its sandbox needs unprivileged
      # user namespaces, which Ubuntu 24.04 restricts, hence CHROME_NO_SANDBOX.
      - name: Browser smoke test
        env:
          CHROME_NO_SANDBOX: "1"
        run: python3 tools/smoke.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip non-deploy assets
        run: |
          rm -rf images/_originals .vscode .DS_Store
          find . -name ".DS_Store" -delete || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
