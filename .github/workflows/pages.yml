name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs in check mode rather than rewriting: Netlify publishes the repo
      # directly with no build command, so the stamped index.html has to be the
      # committed one or the two hosts would serve different URLs. Failing here
      # is the point -- an unstamped asset is invisible to anyone who has
      # already visited, because netlify.toml marks it immutable for a year.
      - name: Check asset cache stamps are current
        run: python3 tools/stamp-assets.py --check

      - name: Strip non-deploy assets
        run: |
          rm -rf images/_originals .vscode .DS_Store
          find . -name ".DS_Store" -delete || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
